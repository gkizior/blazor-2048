# Weekly dependency updates. Minor and patch updates are grouped into one PR per ecosystem;
# major updates get their own PRs so breaking changes can be reviewed separately.
# Every PR runs the full CI test pipeline (build + xUnit/bUnit + Playwright E2E) without deploying.
version: 2
updates:
  # All NuGet packages in the solution (app, tests, tools/DocsBuilder).
  - package-ecosystem: "nuget"
    directory: "/"
    ignore:
      # Stay on .NET 11; hold .NET 12+ majors so the next runtime bump is Garrett's decision.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  # Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # The .NET SDK version in global.json.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    ignore:
      # Stay on the .NET 11 SDK; hold .NET 12+ majors so the next SDK major is Garrett's decision.
      - dependency-name: "dotnet-sdk"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      dotnet-sdk-minor-and-patch:
        update-types: ["minor", "patch"]

  # mermaid-cli + puppeteer for DocsBuilder's diagram pre-rendering (build-time only).
  - package-ecosystem: "npm"
    directory: "/tools/mermaid"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
