# Weekly dependency updates. Minor and patch updates are grouped into one PR per ecosystem;
# major updates get their own PRs so breaking changes can be reviewed separately.
# Every PR runs the full CI test pipeline (build + xUnit/bUnit + Playwright E2E) without deploying.
version: 2
updates:
  # All NuGet packages in the solution (app, tests, tools/DocsBuilder).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  # Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # The .NET SDK version in global.json.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    groups:
      dotnet-sdk-minor-and-patch:
        update-types: ["minor", "patch"]
