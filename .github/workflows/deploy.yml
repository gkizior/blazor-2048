name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Blazor2048.sln

      - name: Build
        run: dotnet build Blazor2048.sln -c Release --no-restore

      # xUnit v3 logic tests + bUnit component tests (Playwright E2E tests skip here; see the e2e job).
      # global.json opts `dotnet test` into Microsoft.Testing.Platform, which xUnit v3 uses.
      - name: Test (logic + bUnit)
        run: dotnet test --solution Blazor2048.sln -c Release --no-build

      - name: Publish
        run: dotnet publish src/Blazor2048/Blazor2048.csproj -c Release -o publish --no-restore

      - name: Prepare for GitHub Pages (base href, 404.html, .nojekyll)
        run: python3 scripts/prepare-pages.py publish/wwwroot "/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: publish/wwwroot

  e2e:
    name: E2E (Playwright for .NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish app the same way as for Pages
        run: |
          dotnet publish src/Blazor2048/Blazor2048.csproj -c Release -o publish
          python3 scripts/prepare-pages.py publish/wwwroot "/${{ github.event.repository.name }}/"

      - name: Build E2E tests
        run: dotnet build tests/Blazor2048.E2ETests -c Release

      - name: Install Playwright Chromium
        shell: pwsh
        run: tests/Blazor2048.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        env:
          RUN_E2E: "1"
          E2E_SITE_DIR: ${{ github.workspace }}/publish/wwwroot
        run: dotnet test --project tests/Blazor2048.E2ETests -c Release --no-build

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
