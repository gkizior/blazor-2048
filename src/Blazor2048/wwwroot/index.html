<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>2048</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <meta name="description" content="The 2048 puzzle as a .NET 10 Blazor WebAssembly PWA: dark mode, smooth animations, offline play and built-in docs." />
    <!-- theme-color is rendered by MainLayout (HeadContent) so it follows the selected theme. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blazor 2048" />
    <meta property="og:title" content="2048 · Blazor WebAssembly · .NET 10" />
    <meta property="og:description" content="The 2048 puzzle as a .NET 10 Blazor WebAssembly PWA: dark mode, smooth animations, offline play and built-in docs." />
    <meta property="og:url" content="https://gkizior.github.io/blazor-2048/" />
    <meta property="og:image" content="https://gkizior.github.io/blazor-2048/docs-content/images/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="2048 board in the app's palette with the text Blazor WebAssembly · .NET 10" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="2048 · Blazor WebAssembly · .NET 10" />
    <meta name="twitter:description" content="The 2048 puzzle as a .NET 10 Blazor WebAssembly PWA with dark mode, animations and docs." />
    <meta name="twitter:image" content="https://gkizior.github.io/blazor-2048/docs-content/images/social-preview.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="2048" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading">
            <div class="loading-tile">2048</div>
            <div class="loading-text">Loading…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker && navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
